<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <site-shell active="credits">
    <section class="panel" id="panel-credits">
      <div class="panel-header">
        <span class="title">GIANT-sp is part of GIANT (Greenland Ice sheet to AtlaNtic Tipping points from ice loss), funded by ARIA</span>
      </div>
      <div class="content">
        <div class="inner">
          <img class="credits-figure" src="images/GIANT_overview.png" alt="The search for Greenland's tipping points: GIANT project overview showing ocean and fjord model grids and an observing system at a tidewater glacier" />
          <p>
            GIANT-sp is built on
            <a href="https://github.com/alan-turing-institute/deepsensor" target="_blank" rel="noopener">DeepSensor</a>.
          </p>
          <div class="credits-logos">
            <img src="logos/giant.png" alt="GIANT" />
            <img src="logos/bas_white.png" alt="British Antarctic Survey" />
            <img src="logos/media_DMI.png" alt="Danish Meteorological Institute" />
            <img src="logos/turing_white.png" alt="The Alan Turing Institute" />
            <img src="logos/aria_white.png" alt="ARIA" />
          </div>
        </div>
      </div>
    </section>
  </site-shell>
  <script src="nav.js"></script>
</body>
</html>
