<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <site-shell active="data">
    <section class="panel" id="panel-data">
      <div class="panel-header">
        <span class="title">The tool trains AI emulators for surface melt using outputs from HIRHAM5 Regional Climate Model data</span>
        <a href="data-detail.html">More on our input data sources →</a>
      </div>
      <div class="frame-wrap">
        <iframe
          src="dashboard/"
          title="GIANT data dashboard"
          loading="lazy"
          allow="fullscreen"
        ></iframe>
      </div>
    </section>
  </site-shell>
  <script src="nav.js"></script>
  <script>
    // The dashboard reports whether it's showing live data or its saved copy.
    window.addEventListener("message", (e) => {
      if (e.origin !== location.origin || e.data?.type !== "dashboard-data-mode") return;
      document.getElementById("live-label").hidden = e.data.offline;
    });
  </script>
</body>
</html>
