defaults:
  - experiment: hirham5zarr_debug
  - override hydra/job_logging: giant_sp
  - _self_

hydra:
  job:
    chdir: false

inference:
  val_set: "station" # station, random-land, no-obs
  n_obs: 400
  run_ref: "acoca/giant-sp/4flbw8xy"
  weights_filename: "best-weights-stnval.pt"
  date_split: "test"
  every: 200
  seed: 321
  plot: false
  log_wandb: true # Log this inference to W&B, linked to the training run (run_ref)
  wandb_project: "present-eval" # W&B project for evaluation runs
  wandb_entity: null # null = the training run's entity
