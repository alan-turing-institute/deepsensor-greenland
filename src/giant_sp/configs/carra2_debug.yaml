# DeepSensor Model Debug Configuration for CARRA2

# Data settings
data:
  source: "carra2"
  data_path: "data/anemoi/processed/carra2"
  data_pattern: "carra2-greenland-2p5km-1986-2025-1M-v1-xy-2p5km*.nc"
  ancillary_path: "data/reference/bm_v6"
  station_locations_file: "data/station/promice/processed/promice_locations.csv"
  context_var_IDs: [["2t_abs"],["10u_abs","10v_abs"]]
  target_var_IDs: "2t_abs"
  region: "greenland"
  basin: "CE" #CE, CW, NE, NO, NW, SE, SW
  train_start: "1987-01-01"
  train_end: "1987-12-01"
  val_start: "1988-01-01"
  val_end: "1988-12-01"
  test_start: "1988-01-01"
  test_end: "1988-12-01"

dataloader:
  lsm_mask: false
  train_sampling: "land_obs"
  context_delta_t: null
  target_sampling: "all"
  frequency: "MS"
  temporal_sampling_method: "regular"
  temporal_sampling_every: 1
  change_dates_every_epoch: false

# Model architecture
model:
  likelihood: "gnp"
  unet_channels: [64, 64, 64]
  unet_kernels: 5
  num_basis_functions: 32

# Training parameters
training:
  num_epochs: 3
  batch_size: 1
  learning_rate: 0.0003
  lr_scheduler: "reduce_on_plateau"
  lr_patience: 10
  lr_factor: 0.5

  # Early stopping
  early_stopping: true
  patience: 20

  # Checkpointing
  save_checkpoint_every: 1
  save_best_only: true

  # Optimization
  optimizer: "adam"  # Options: "adam", "adamw", "sgd"
  weight_decay: 0.0001
  gradient_clip: 1.0

  # resume training
  resume: false
  wandb_run_id: "stwjm7cy"  # Run ID to resume(null = latest)

# Logging
logging:
  log_level: "INFO"
  tensorboard: true
  wandb:
    enabled: true  # Set to true to enable W&B logging
    project: "present-train"  # W&B project name
    entity: "turing-giant"  # Your W&B username/team (null = default)
    name: null  # Run name (null = auto-generated)
    tags: ["spatial-interpolation", "convgnp", "t2m", "carra2", "debug"]  # Tags for organizing runs
    notes: ""  # Optional docs about this run
    log_frequency: 1  # Log metrics every N epochs
    log_maps: true  # Log prediction maps
    log_maps_frequency: 1  # Log maps every N epochs
    log_charts: true  # Log charts every N epochs
    log_charts_frequency: 1  # Log charts every N epochs
    log_model: true  # Log model checkpoints as artifacts
    watch_model: false  # Watch model gradients and parameters
    watch_freq: 100  # Log gradients every N steps
  log_stnval: true

# Visualization
visualization:
  plot_dates: null
  res_factor_maps: 1
  crs: north_polar
  cmap: "viridis"
  fig_size: 3
