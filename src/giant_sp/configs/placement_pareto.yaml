defaults:
- experiment: hirham5zarr_debug
- _self_

hydra:
  job:
    chdir: false

placement_pareto:
  run_ref: "turing-giant/present-train/vloyijco"
  acq_file: "outputs/vloyijco/placement/ExpectedOccurrenceEntropyReduction/AcqFn_ExpectedOccurrenceEntropyReduction_10-iter_sseasonal_e50_sr9_weights-ep95.nc"
  cost: "distance2stations" # distance2stations, distance2border, elevation, albedo
  output_dir: "outputs"

  #distance2stations specific parameters, ignore if cost is not distance2stations
  distance2stations_file: "outputs/vloyijco/placement/ContextDist/AcqFn_ContextDist_10-iter_sseasonal_e50_sr9_weights-ep95.nc"

  #elevation specific parameters, ignore if cost is not elevation
  elevation_file: "data/hirham5/h5_elevation_GRL.nc"

  #albedo specific parameters, ignore if cost is not albedo
  search_start_date: "2016-01-01"
  search_end_date: "2016-12-31"
