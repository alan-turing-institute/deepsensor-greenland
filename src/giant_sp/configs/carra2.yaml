# DeepSensor Model Configuration for CARRA2

# Data settings
data:
  source: "carra2"
  data_path: "/gws/pw/j07/aria_giant/wip/draft/acocac/anemoi/datasets/processed/carra2"
  data_pattern: "carra2-greenland-2p5km-1986-2025-1M-v1-xy-2p5km*.nc"
  bedmachine_ancillary_path: "/gws/pw/j07/aria_giant/wip/draft/acocac/data/reference/bedmachinev6"
  station_locations_file: "/gws/pw/j07/aria_giant/wip/draft/acocac/deepsensor/data/greenland/station/processed/promice_locations.csv"
  context_var_IDs:  [["2t_abs"],["10u_abs","10v_abs"]]
  target_var_IDs: "2t_abs"
  region: "greenland"
  basin: null #SE, CE
  train_start: "1986-01-01"
  train_end: "1991-12-01"
  val_start: "1992-01-01"
  val_end: "1993-12-01"
  test_start: "2023-01-01"
  test_end: "2023-12-01"

dataloader:
  lsm_mask: true
  train_sampling: "land_obs"
  target_sampling: "all"
  frequency: "D"
  sampling: 1
  change_dates_every_epoch: false

# Model architecture
model:
  likelihood: "gnp"
  unet_channels: [128, 128, 128, 128]
  unet_kernels: 5
  num_basis_functions: 128

# Training parameters
training:
  num_epochs: 50
  batch_size: 1
  learning_rate: 0.0005
  lr_scheduler: "reduce_on_plateau"
  lr_patience: 10
  lr_factor: 0.5

  # Early stopping
  early_stopping: true
  patience: 20

  # Checkpointing
  save_checkpoint_every: 2
  save_best_only: true

  # Optimization
  optimizer: "adam"  # Options: "adam", "adamw", "sgd"
  weight_decay: 0.0001
  gradient_clip: 1.0

  # resume training
  resume: false
  wandb_run_id: "stwjm7cy"  # Run ID to resume(null = latest)

# Logging
logging:
  log_level: "INFO"
  tensorboard: true
  wandb:
    enabled: true  # Set to true to enable W&B logging
    project: "present-train"  # W&B project name
    entity: "turing-giant"  # Your W&B username/team (null = default)
    name: null  # Run name (null = auto-generated)
    tags: ["spatial-interpolation", "convgnp", "t2m", "carra2"]  # Tags for organizing runs
    notes: ""  # Optional docs about this run
    log_frequency: 1  # Log metrics every N epochs
    log_maps: true  # Log prediction maps
    log_maps_frequency: 5  # Log maps every N epochs
    log_charts: true  # Log charts every N epochs
    log_charts_frequency: 5  # Log charts every N epochs
    log_model: true  # Log model checkpoints as artifacts
    watch_model: false  # Watch model gradients and parameters
    watch_freq: 100  # Log gradients every N steps
  log_stnval: true

# Visualization
visualization:
  plot_dates: ["1992-01-01", "1992-06-01", "1992-12-01"]  # Specific dates to plot
  res_factor_maps: 1
  crs: north_polar
  cmap: "viridis"
  fig_size: 3