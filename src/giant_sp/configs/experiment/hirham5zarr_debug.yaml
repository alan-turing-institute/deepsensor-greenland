# @package _global_
# DeepSensor Model Debug Configuration for HIRHAM5 (zarr source) — overrides on top of
# `hirham5_debug`; only the data backend differs from the non-zarr debug config.

defaults:
  - hirham5_debug
  - _self_

data:
  source: "hirham5zarr"
  data_path: "data/anemoi/processed/hirham5zarr/greenland"
  data_pattern: "base_dataset.zarr"
  ancillary_path: "data/anemoi/processed/hirham5zarr/greenland"
  context_var_IDs: [["snmel_abs"], ["ahfl_abs", "ahfs_abs", "dlwrad_abs", "dswrad_abs", "rainfall_abs", "snfall_abs", "tas_abs"], ["rainfall_10yr-avg", "snfall_10yr-avg", "tas_10yr-avg"]]

dataloader:
  context_delta_t: [[0], [-9, -8, -7, -6, -5, -4, -3, -2, -1, 0], [0]]
