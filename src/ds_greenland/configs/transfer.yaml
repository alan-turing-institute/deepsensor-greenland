defaults:
- experiment: hirham5zarr_debug
- paths: jasmin
- override hydra/job_logging: ds_greenland
- _self_

hydra:
  job:
    chdir: false

# Fine-tunes the pretrained model below on the dataset of the selected `experiment`. The
# experiment's `model` section is ignored (the pretrained architecture is used instead), but its
# data.context_var_IDs/target_var_IDs and dataloader.context_delta_t must have the same structure
# as the pretrained run's. Fine-tuning usually wants a lower `training.learning_rate` than training
# from scratch, e.g. `training.learning_rate=0.00003`.
transfer:
  run_ref: "acoca/giant-sp/4flbw8xy" # Pretrained W&B run (entity/project/run_id)
  weights_filename: "best-weights-stnval.pt"
  # false: normalise the new data with the pretrained run's statistics; true: fit them on the new
  # data (the coordinate normalisation is always the pretrained run's)
  refit_normalisation: false
  # Parameter-name prefixes to keep fixed, e.g. "decoder.links.0.before_turn_layers" (UNet
  # downsampling path), "decoder.links.0.after_turn_layers" (upsampling path),
  # "decoder.links.0.final_linear" (output layer). Empty = fine-tune everything.
  freeze: []
  zero_shot_eval: true # Log the pretrained model's loss on the new validation tasks first
