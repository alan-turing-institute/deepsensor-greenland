[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "giant-sp"
version = "0.1.0"
authors = [
  { name = "Alejandro Coca-Castro", email = "acoca@turing.ac.uk" },
  { name = "Isabel Fenton", email = "ifenton@turing.ac.uk" },
]
description = " Sensor placement to aid location planning in GIANT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
    "cartopy>=0.25.0",
    "colorcet>=3.2.1",
    "deepsensor>=0.4.3",
    "geopandas>=1.1.4",
    "hydra-core>=1.3.5",
    "scipy>=1.17.1",
    "torch>=2.12.1",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "demo" },
  "pre-commit>=4.0",
]
test = [
  # Only the web-app layer of the demo is tested, so arraylake/uvicorn aren't needed here.
  "fastapi>=0.141.1",
  "httpx2>=2.13.1",
  "pytest>=8.0",
  "pytest-cov>=6.0",
]
lint = [
  "mypy>=1.15",
  "ruff>=0.15",
]
# Local demo site + Arraylake-backed data dashboard (`uv run python -m giant_sp.demo`).
demo = [
  # arraylake>=1.0 (needed for this repo's Icechunk v2 format) requires Python 3.12+.
  "arraylake>=1.3.0; python_full_version >= '3.12'",
  # cartopy 0.25 fails drawing gridline labels on the polar-stereographic maps.
  "cartopy>=0.26.0",
  "cftime>=1.6.5",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.54.0",
  "zarr>=3.1.6",
]

[project.urls]
Homepage = "https://github.com/alan-turing-institute/giant-sp"
"Bug Tracker" = "https://github.com/alan-turing-institute/giant-sp/issues"
Discussions = "https://github.com/alan-turing-institute/giant-sp/discussions"
Changelog = "https://github.com/alan-turing-institute/giant-sp/releases"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  # deepsensor's `lab` dependency triggers this on import; not actionable from giant_sp.
  "ignore:numpy.core is deprecated.*:DeprecationWarning:lab",
  # netCDF4's compiled extension warns about a numpy ABI size mismatch on import.
  # Not module-scoped: CPython attributes warnings from single-phase-init C
  # extensions (e.g. netCDF4's _netCDF4.pyx) to importlib._bootstrap rather than
  # the extension itself, so a module filter can't target netCDF4 specifically.
  # The message pattern is already specific to this exact ABI-mismatch text.
  "ignore:numpy.ndarray size changed.*:RuntimeWarning",
  # netCDF4's compiled extension does an in-place ndarray.shape assignment on
  # write, deprecated under numpy>=2.5; not actionable from giant_sp.
  "ignore:Setting the shape on a NumPy array.*:DeprecationWarning",
  # cartopy fetches Natural Earth coastlines on first use (e.g. on a fresh CI
  # runner with no cache) and warns that it's downloading; not a failure.
  "ignore::cartopy.io.DownloadWarning",
]
log_cli_level = "INFO"
testpaths = [
  "tests",
]

[tool.coverage]
run.source = ["giant_sp"]
port.exclude_lines = [
  'pragma: no cover',
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
python_version = "3.11"
files = ["src/giant_sp", "tests"]
explicit_package_bases = true
mypy_path = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "deepsensor.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "PT",   # flake8-pytest-style
  "G",    # flake8-logging-format
  "PGH",  # pygrep-hooks
  "RUF",  # Ruff-specific rules
  "D",    # pydocstyle
]
ignore = ["E501"] # line-too-long
unfixable = [
  "F401",   # Would remove unused imports
  "F841",   # Would remove unused variables
]

[tool.ruff.lint.isort]
known-first-party = ["giant_sp"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D100",  # undocumented-public-module
  "D101",  # undocumented-public-class
  "D102",  # undocumented-public-method
  "D103",  # undocumented-public-function
]

[tool.ruff.format]
docstring-code-format = true
